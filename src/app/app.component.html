@if (!store.data() && !store.error()) {
  <div class="boot">
    <img src="/images/logo.png" alt="Pizza Crunch">
    <p>Firing up the oven...</p>
  </div>
}
@if (store.error()) {
  <div class="error-box"><p>{{ store.error() }}</p></div>
}
@if (store.data(); as data) {
  <div class="shell" [class.blurred]="splash()">
    <app-header />
    <main><router-outlet /></main>
    <app-footer />
    <app-bottom-nav />
  </div>
  @if (splash()) {
    <div class="splash">
      <div class="splash-card">
        <button type="button" class="splash-x" (click)="closeSplash()" aria-label="Close deal">×</button>
        <img [src]="data.settings.splashImage" alt="Today's deal">
      </div>
    </div>
  }
  @if (!splash()) {
    <a class="wa-fab" [href]="'https://wa.me/' + data.settings.whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M20.52 3.48A11.86 11.86 0 0 0 12.04 0C5.42 0 .04 5.37.04 12c0 2.11.55 4.17 1.6 5.99L0 24l6.16-1.61A11.94 11.94 0 0 0 12.04 24C18.66 24 24 18.63 24 12.04c0-3.2-1.25-6.21-3.48-8.56zM12.04 21.82c-1.9 0-3.76-.5-5.39-1.45l-.39-.23-3.66.96.98-3.56-.25-.4a9.78 9.78 0 0 1-1.5-5.2c0-5.4 4.4-9.79 9.81-9.79 2.62 0 5.08 1.02 6.93 2.88a9.74 9.74 0 0 1 2.87 6.93c0 5.4-4.4 9.86-9.8 9.86zm5.38-7.34c-.29-.15-1.74-.86-2.01-.96-.27-.1-.47-.15-.66.15-.2.29-.76.96-.93 1.15-.17.2-.34.22-.63.07-.29-.14-1.22-.45-2.33-1.43-.86-.77-1.44-1.71-1.61-2-.17-.29-.02-.45.13-.59.13-.13.29-.34.44-.51.14-.17.19-.29.29-.49.1-.2.05-.36-.02-.51-.07-.15-.66-1.59-.9-2.18-.24-.57-.48-.49-.66-.5h-.56c-.2 0-.51.07-.78.36-.27.29-1.02 1-1.02 2.43 0 1.43 1.04 2.81 1.19 3 .15.2 2.05 3.13 4.96 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.12.55-.08 1.74-.71 1.99-1.4.24-.69.24-1.28.17-1.4-.07-.13-.27-.2-.56-.34z"/>
      </svg>
    </a>
  }
  <app-cart-drawer />
  <app-item-modal />
}
<app-toasts />
<button type="button" class="to-top" [class.show]="scrolled()" (click)="top()" aria-label="Back to top">↑</button>
